[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
ast = true  # hevm symbolic execution needs ASTs in build artifacts
dynamic_test_linking = false  # external symbolic engines (hevm/kontrol) cannot execute DTL-rewritten vm.deployCode
gas_price = 1               # concrete gasprice: KEVM symbolic GASPRICE_CELL breaks uint comparisons in proof mode
# PINNED: the EVM target determines the bytecode. Unpinned, a toolchain
# bump (e.g. solc 8.38 defaulting to osaka) silently changes the compiled
# code and breaks CREATE2 address determinism across chains. Bump this
# DELIBERATELY, together with solc_version, and expect a new address family.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read", path = "./"}]
gas_reports = ["PeekRegistry", "PharaohEpochKeeper"]

# HACVSP audit alignment (2026-11-05): compiler moved to current pinned 0.8.38
# + spec-locked audit build settings (via_ir, 200 runs, ipfs metadata) ahead of
# mainnet — contract will be redeployed; CREATE2 address family changes.

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 512
depth = 64
fail_on_revert = false

[profile.fuzz]
fuzz = { runs = 100000 }
invariant = { runs = 2048, depth = 128 }

[profile.coverage]
fuzz = { runs = 128 }
invariant = { runs = 64, depth = 32 }

# Stage 11 — solc SMTChecker (bmc + chc). SMT lives in its OWN profile so
# ordinary builds (local, CI, Kontrol) never run it — Kontrol's solver-linked
# solc would otherwise burn hours of CHC inside `kontrol build`.
# Stage 11 invokes it with FOUNDRY_PROFILE=smt.
[profile.smt.model_checker]
engine = "all"
targets = ["assert", "underflow", "overflow", "divByZero", "balance"]
timeout = 120000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
